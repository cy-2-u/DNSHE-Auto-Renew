name: DNSHE Domain Auto Renew

on:
  schedule:
    # 23 0 1 * * = 每月 1 日 UTC 00:23，即北京时间 08:23
    # 刻意错开整点，降低 GitHub schedule 在高峰被延迟或丢弃的概率。
    # 新仓库 / 不活跃仓库的 schedule 可能根本不触发，请同时用
    # cron-job.org 调 workflow_dispatch（见 README）。
    - cron: '23 0 1 * *'
  workflow_dispatch:

concurrency:
  group: dnshe-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
      DNSHE_API_SECRET: ${{ secrets.DNSHE_API_SECRET }}
      MEOW_NICKNAME: ${{ secrets.MEOW_NICKNAME }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUSH_LEVEL: ${{ vars.PUSH_LEVEL }}
      DNSHE_RENEW_THRESHOLD_DAYS: ${{ vars.DNSHE_RENEW_THRESHOLD_DAYS }}
      DNSHE_MIN_INTERVAL: ${{ vars.DNSHE_MIN_INTERVAL }}
      DNSHE_TZ_OFFSET: ${{ vars.DNSHE_TZ_OFFSET }}
      DNSHE_API_BASE_URL: ${{ vars.DNSHE_API_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run renew script
        run: python renew_domains.py
        timeout-minutes: 10
